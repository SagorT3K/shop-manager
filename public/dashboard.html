<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Bikroy Hisab</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background: var(--primary-light);">👥</div>
            <div>
              <div class="stat-label" data-i18n="customerCount">গ্রাহক</div>
              <div class="stat-value" id="statCustomers" style="color: var(--primary);">0</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: var(--success-bg);">🛒</div>
            <div>
              <div class="stat-label" data-i18n="todaySales">আজকের বিক্রয়</div>
              <div class="stat-value" id="statTodaySales" style="color: var(--success);">৳০</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: var(--warning-bg);">💰</div>
            <div>
              <div class="stat-label" data-i18n="totalDue">মোট বাকি</div>
              <div class="stat-value" id="statTotalDue" style="color: var(--warning);">৳০</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title" data-i18n="quickActions">দ্রুত কাজ</div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <a href="/customers.html" class="btn btn-primary" data-i18n="addCustomer">গ্রাহক যোগ</a>
            <a href="/sales.html" class="btn btn-outline" data-i18n="salesHistory">বিক্রয় ইতিহাস</a>
            <a href="/customers.html" class="btn btn-ghost" data-i18n="customerList">গ্রাহক তালিকা</a>
          </div>
        </div>

        <div class="card">
          <div class="card-title">
            <span data-i18n="recentTransactions">সাম্প্রতিক লেনদেন</span>
            <a href="/customers.html" data-i18n="viewAll">সব দেখুন</a>
          </div>
          <div id="recentList"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script>
    initApp('dashboard')
      .then(loadDashboard)
      .catch(err => { if (!window.location.pathname.endsWith('login.html')) toast(err.message, 'error'); });

    function renderRecent(transactions) {
      const container = document.getElementById('recentList');
      if (!transactions.length) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div data-i18n="noTransactions">কোনো লেনদেন নেই</div></div>`;
        return;
      }
      container.innerHTML = transactions.map(tx => {
        const isDue = tx.type === 'due';
        const badge = isDue
          ? (tx.status === 'paid'
              ? `<span class="badge badge-success" data-i18n="dueStatusPaid">পরিশোধিত</span>`
              : tx.status === 'partial'
                ? `<span class="badge badge-warning" data-i18n="dueStatusPartial">আংশিক</span>`
                : `<span class="badge badge-danger" data-i18n="dueStatusUnpaid">বাকি</span>`)
          : `<span class="badge badge-primary" data-i18n="paymentType">পেমেন্ট</span>`;
        return `
          <div class="transaction-row">
            <div class="tx-main">
              <div class="tx-title">${esc(isDue ? tx.productName : (tx.customerName || t('paymentType')))}</div>
              <div class="tx-sub">${esc(tx.customerName || '')} · ${formatDateTime(tx.date)}</div>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
              ${badge}
              <div class="tx-amount ${isDue ? 'amount-negative' : 'amount-positive'}">${formatCurrency(tx.amount)}</div>
            </div>
          </div>`;
      }).join('');
      applyI18n();
    }

    async function loadDashboard() {
      const data = await API.get('/api/dashboard');
      document.getElementById('statCustomers').textContent = data.customerCount;
      document.getElementById('statTodaySales').textContent = formatCurrency(data.todaySales);
      document.getElementById('statTotalDue').textContent = formatCurrency(data.totalUnpaidDues);
      renderRecent(data.recentTransactions);
    }

    loadDashboard().catch(err => toast(err.message, 'error'));
  </script>
</body>
</html>
