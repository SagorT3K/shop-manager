<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales - Bikroy Hisab</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="card" style="background: var(--primary-light);">
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
            <div>
              <div style="font-size:14px; color:var(--text-secondary);" data-i18n="todaySalesSummary">আজকের বিক্রয়</div>
              <div style="font-size:30px; font-weight:800; color:var(--primary-dark);" id="todayTotal">৳০</div>
              <div style="font-size:13px; color:var(--text-secondary);" id="todayCount"></div>
            </div>
            <button class="btn btn-primary" onclick="openSaleModal()">＋ <span data-i18n="newSale">নতুন বিক্রয়</span></button>
          </div>
        </div>

        <div class="card">
          <div class="card-title" data-i18n="allSales">সকল বিক্রয়</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="product">পণ্য</th>
                  <th data-i18n="quantity">পরিমাণ</th>
                  <th data-i18n="price">মূল্য</th>
                  <th data-i18n="totalAmount">মোট</th>
                  <th data-i18n="date">তারিখ</th>
                  <th data-i18n="customer">গ্রাহক</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="salesTable"></tbody>
            </table>
          </div>
          <div id="salesEmpty" class="empty-state" style="display:none;">
            <div class="empty-icon">🛒</div>
            <div data-i18n="noSales">কোনো বিক্রয় রেকর্ড নেই</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- New sale modal -->
  <div class="modal" id="saleModal">
    <div class="modal-card">
      <div class="modal-title" data-i18n="newSale">নতুন বিক্রয়</div>
      <div class="form-group">
        <label data-i18n="productName">পণ্যের নাম</label>
        <input type="text" id="sProduct" class="form-control" data-i18n-placeholder="productName">
      </div>
      <div class="form-group">
        <label data-i18n="quantity">পরিমাণ</label>
        <input type="number" id="sQuantity" class="form-control" min="1" step="1" value="1">
      </div>
      <div class="form-group">
        <label data-i18n="price">মূল্য (প্রতি ইউনিট)</label>
        <input type="number" id="sPrice" class="form-control" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label data-i18n="customer">গ্রাহক (ঐচ্ছিক)</label>
        <select id="sCustomer" class="form-control">
          <option value="">—</option>
        </select>
      </div>
      <div class="form-group">
        <label data-i18n="note">নোট (ঐচ্ছিক)</label>
        <textarea id="sNote" class="form-control"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal('saleModal')" data-i18n="cancel">বাতিল</button>
        <button class="btn btn-primary" onclick="saveSale()" data-i18n="save">সংরক্ষণ</button>
      </div>
    </div>
  </div>

  <div class="modal" id="confirmModal">
    <div class="modal-card">
      <div class="modal-title" data-i18n="confirm">নিশ্চিত করুন</div>
      <p id="confirmModalText" style="margin-bottom:8px;"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmModalCancel" data-i18n="cancel">বাতিল</button>
        <button class="btn btn-danger" id="confirmModalOk" data-i18n="delete">মুছুন</button>
      </div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script>
    initApp('sales')
      .then(loadSales)
      .catch(err => toast(err.message, 'error'));

    let allSales = [];
    let customers = [];

    async function loadSales() {
      allSales = await API.get('/api/sales');
      const today = await API.get('/api/sales/today');
      document.getElementById('todayTotal').textContent = formatCurrency(today.total);
      document.getElementById('todayCount').textContent = `${today.count} ${t('transactionsCount')}`;
      renderSales();
    }

    function renderSales() {
      const tbody = document.getElementById('salesTable');
      const empty = document.getElementById('salesEmpty');
      tbody.innerHTML = '';
      empty.style.display = allSales.length ? 'none' : 'block';
      allSales.forEach(s => {
        const cust = s.customerId ? customers.find(c => c.id === s.customerId) : null;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight:600;">${esc(s.productName)}</td>
          <td>${esc(s.quantity)}</td>
          <td>${formatCurrency(s.price)}</td>
          <td style="font-weight:700; color:var(--primary);">${formatCurrency(s.totalAmount)}</td>
          <td>${formatDate(s.date)}</td>
          <td>${cust ? esc(cust.name) : ''}</td>
          <td style="text-align:right;"><button class="icon-btn danger" title="${t('delete')}" onclick="deleteSale(${s.id})">🗑️</button></td>`;
        tbody.appendChild(tr);
      });
      applyI18n();
    }

    async function openSaleModal() {
      if (!customers.length) {
        customers = await API.get('/api/customers');
        const sel = document.getElementById('sCustomer');
        sel.innerHTML = '<option value="">—</option>' +
          customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
      }
      document.getElementById('sProduct').value = '';
      document.getElementById('sQuantity').value = '1';
      document.getElementById('sPrice').value = '';
      document.getElementById('sNote').value = '';
      openModal('saleModal');
      setTimeout(() => document.getElementById('sProduct').focus(), 50);
    }

    async function saveSale() {
      const productName = document.getElementById('sProduct').value.trim();
      const quantity = document.getElementById('sQuantity').value;
      const price = document.getElementById('sPrice').value;
      if (!productName) { toast(t('productNameRequired'), 'error'); return; }
      if (!quantity || Number(quantity) <= 0 || !price || Number(price) <= 0) {
        toast(t('quantityPriceRequired'), 'error'); return;
      }
      try {
        const customerId = document.getElementById('sCustomer').value;
        await API.post('/api/sales', {
          productName,
          quantity: Number(quantity),
          price: Number(price),
          customerId: customerId ? Number(customerId) : null,
          note: document.getElementById('sNote').value.trim()
        });
        closeModal('saleModal');
        toast(t('saveSuccess'));
        await loadSales();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    function deleteSale(id) {
      confirmDialog(t('deleteSaleConfirm'), async () => {
        try {
          await API.del(`/api/sales/${id}`);
          toast(t('deleteSuccess'));
          await loadSales();
        } catch (err) { toast(err.message, 'error'); }
      });
    }
  </script>
</body>
</html>
