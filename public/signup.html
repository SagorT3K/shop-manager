<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Bikroy Hisab</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div style="text-align:right; margin-bottom:8px;">
        <button id="langToggle" class="lang-toggle" title="Language"></button>
      </div>
      <div class="login-brand">
        <div class="brand-icon">🧾</div>
        <h1 data-i18n="appName">বিক্রয় হিসাব</h1>
        <p data-i18n="signupTitle">নতুন অ্যাকাউন্ট তৈরি করুন</p>
      </div>
      <form id="signupForm">
        <div class="form-group">
          <label for="fullName" data-i18n="fullName">পুরো নাম</label>
          <input type="text" id="fullName" class="form-control" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="username" data-i18n="username">ব্যবহারকারীর নাম</label>
          <input type="text" id="username" class="form-control" autocomplete="username" data-i18n-placeholder="username">
        </div>
        <div class="form-group">
          <label for="password" data-i18n="password">পাসওয়ার্ড</label>
          <input type="password" id="password" class="form-control" autocomplete="new-password" data-i18n-placeholder="password">
        </div>
        <div id="signupError" style="color: var(--danger); font-size: 13px; margin-bottom: 12px; display: none;"></div>
        <button type="submit" class="btn btn-primary btn-block" id="signupBtn" data-i18n="signup">নিবন্ধন</button>
      </form>
      <div style="text-align:center; margin-top:16px; font-size:14px;">
        <span data-i18n="haveAccount">ইতিমধ্যে অ্যাকাউন্ট আছে?</span>
        <a href="/login.html" data-i18n="login">লগইন</a>
      </div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script>
    // Verify existing session via the cookie (server-side); if valid, go to dashboard
    fetch('/api/auth/me')
      .then(res => { if (res.ok) window.location.href = '/dashboard.html'; })
      .catch(() => {});

    initLangToggle();
    applyI18n();

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value.trim();
      const errorEl = document.getElementById('signupError');
      const btn = document.getElementById('signupBtn');

      errorEl.style.display = 'none';
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, fullName })
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error === 'Username already exists'
            ? t('usernameExists') : (data.error === 'Password must be at least 4 characters'
              ? t('passwordMin') : t('invalidCredentials'));
          errorEl.style.display = 'block';
          return;
        }
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorEl.textContent = t('invalidCredentials');
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
